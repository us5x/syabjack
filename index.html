<!doctype html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack Friends</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <section class="auth-screen">
<div class="brand-lockup">
  <div class="brand-chip">♠</div>
  <div>
    <div class="eyebrow">PRIVATE TABLE</div>
    <h1>Blackjack Friends</h1>
  </div>
</div>
<div class="auth-card">
  <h2>Log in</h2>
  <form id="loginForm">
    <label class="field">
      <span>Email</span>
      <input id="email" type="email" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="password" type="password" required>
    </label>
    <button class="primary wide" type="submit" id="loginButton">
      Log in
    </button>
  </form>
  <div
    id="result"
    style="
      margin-top:16px;
      padding:12px;
      border-radius:10px;
      background:#18231e;
      white-space:pre-wrap;
      word-break:break-word;
    "
  >
    Ready.
  </div>
</div>
  </section>
</main>
<script>
  const result = document.getElementById("result");
  function show(message) {
    result.textContent = message;
  }
  window.onerror = function(message, source, line, column) {
    show(
      "JAVASCRIPT ERROR\n\n" +
      message +
      "\n\nLine: " +
      line
    );
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (!window.supabase) {
    show("ERROR: Supabase library did not load.");
  } else {
    show("Supabase library loaded.");
  }
</script>
<script src="config.js"></script>
<script>
  if (!window.APP_CONFIG) {
    show("ERROR: config.js did not load.");
  } else {
    show(
      "config.js loaded.\n\n" +
      "Supabase URL: " +
      (window.APP_CONFIG.SUPABASE_URL ? "FOUND" : "MISSING") +
      "\nAnon key: " +
      (window.APP_CONFIG.SUPABASE_ANON_KEY ? "FOUND" : "MISSING")
    );
  }
</script>
<script>
  try {
    const cfg = window.APP_CONFIG;
    const client = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_ANON_KEY
    );
    show("Supabase client created.\n\nPress Log in.");
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();
        show("Login button received.\n\nConnecting to Supabase...");
        const email =
          document.getElementById("email").value.trim();
        const password =
          document.getElementById("password").value;
        try {
          const response =
            await client.auth.signInWithPassword({
              email,
              password
            });
          if (response.error) {
            show(
              "SUPABASE LOGIN ERROR\n\n" +
              response.error.message
            );
            return;
          }
          if (!response.data.session) {
            show(
              "Supabase accepted the request,\n" +
              "but no session was returned."
            );
            return;
          }
          show(
            "LOGIN WORKED!\n\n" +
            "User: " +
            response.data.user.email
          );
        } catch (error) {
          show(
            "LOGIN REQUEST CRASHED\n\n" +
            error.message
          );
        }
      });
  } catch (error) {
    show(
      "PAGE INITIALIZATION ERROR\n\n" +
      error.message
    );
  }
</script>
</body>
</html>
