<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Blackjack Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <main class="shell">
<section class="auth-screen">
  <div class="brand-lockup">
    <div class="brand-chip">
      ♠
    </div>
    <div>
      <div class="eyebrow">
        PRIVATE TABLE
      </div>
      <h1>
        Blackjack Friends
      </h1>
    </div>
  </div>
  <div class="auth-card">
    <div class="eyebrow">
      WELCOME BACK
    </div>
    <h2>
      Log in
    </h2>
    <form id="loginForm">
      <label class="field">
        <span>
          Email
        </span>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        >
      </label>
      <label class="field">
        <span>
          Password
        </span>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >
      </label>
      <button
        class="primary wide"
        type="submit"
        id="loginButton"
      >
        Log in
      </button>
    </form>
    <p class="muted small">
      Don't have an account?
      <a href="signup.html">
        Create one
      </a>
    </p>
    <p class="muted small">
      Private access only. Ask the table owner to approve your email.
    </p>
  </div>
</section>
  </main>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your Supabase configuration -->
  <script src="config.js"></script>
  <script>
    const toast = document.getElementById("toast");
    function showToast(message){
      if(!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.loginToastTimer);
      window.loginToastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 4000);
    }
    /*
      Check that Supabase loaded.
    */
    if(!window.supabase){
      showToast(
        "Supabase could not load. Check your internet connection."
      );
      throw new Error("Supabase library did not load.");
    }
    /*
      Check that config.js loaded.
    */
    if(
      !window.APP_CONFIG ||
      !window.APP_CONFIG.SUPABASE_URL ||
      !window.APP_CONFIG.SUPABASE_ANON_KEY
    ){
      showToast(
        "Supabase configuration is missing."
      );
      throw new Error(
        "APP_CONFIG is missing or incomplete."
      );
    }
    /*
      Create Supabase client.
    */
    const supabase = window.supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    );
    const loginForm =
      document.getElementById("loginForm");
    const loginButton =
      document.getElementById("loginButton");
    /*
      LOGIN
    */
    loginForm.addEventListener(
      "submit",
      async function(event){
        event.preventDefault();
        const email =
          document
            .getElementById("email")
            .value
            .trim();
        const password =
          document
            .getElementById("password")
            .value;
        if(!email || !password){
          showToast(
            "Enter your email and password."
          );
          return;
        }
        loginButton.disabled = true;
        loginButton.textContent =
          "Logging in…";
        try{
          const {
            data,
            error
          } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });
          if(error){
            console.error(
              "Supabase login error:",
              error
            );
            showToast(
              error.message
            );
            loginButton.disabled = false;
            loginButton.textContent =
              "Log in";
            return;
          }
          if(!data || !data.session){
            showToast(
              "Login succeeded, but no session was created."
            );
            loginButton.disabled = false;
            loginButton.textContent =
              "Log in";
            return;
          }
          /*
            LOGIN SUCCESSFUL.
            Now go to the actual Blackjack page.
          */
          showToast(
            "Login successful!"
          );
          setTimeout(() => {
            window.location.href =
              "game.html";
          }, 300);
        }
        catch(error){
          console.error(
            "Login exception:",
            error
          );
          showToast(
            error.message ||
            "Something went wrong while logging in."
          );
          loginButton.disabled = false;
          loginButton.textContent =
            "Log in";
        }
      }
    );
    /*
      If the user is already logged in,
      don't make them log in again.
    */
    async function checkExistingSession(){
      try{
        const {
          data
        } = await supabase.auth.getSession();
        if(data && data.session){
          window.location.href =
            "game.html";
        }
      }
      catch(error){
        console.error(
          "Session check error:",
          error
        );
      }
    }
    checkExistingSession();
  </script>
</body>
</html>
