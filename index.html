<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Blackjack Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <main class="shell">
<section class="auth-screen">
  <div class="brand-lockup">
    <div class="brand-chip">♠</div>
    <div>
      <div class="eyebrow">PRIVATE TABLE</div>
      <h1>Blackjack Friends</h1>
    </div>
  </div>
  <div class="auth-card">
    <div class="eyebrow">PRIVATE TABLE</div>
    <h2>Log in</h2>
    <form id="loginForm">
      <label class="field">
        <span>Email</span>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        >
      </label>
      <label class="field">
        <span>Password</span>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >
      </label>
      <button
        id="loginButton"
        class="primary wide"
        type="submit"
      >
        Log in
      </button>
    </form>
    <p class="muted small">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>
    <p class="muted small">
      Private access only. Ask the table owner to approve your email.
    </p>
  </div>
</section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const client = window.supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    );
    const form =
      document.getElementById("loginForm");
    const button =
      document.getElementById("loginButton");
    const toast =
      document.getElementById("toast");
    function showMessage(message){
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }
    /*
      If Supabase already has a saved session,
      go straight to the game.
    */
    async function checkLogin(){
      const { data, error } =
        await client.auth.getSession();
      if(error){
        console.error(error);
        return;
      }
      if(data.session){
        window.location.replace("game.html");
      }
    }
    /*
      LOGIN
    */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;
      if(!email || !password){
        showMessage(
          "Enter your email and password."
        );
        return;
      }
      button.disabled = true;
      button.textContent = "Logging in…";
      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });
      if(error){
        console.error(
          "LOGIN ERROR:",
          error
        );
        showMessage(error.message);
        button.disabled = false;
        button.textContent = "Log in";
        return;
      }
      if(!data.session){
        showMessage(
          "Login succeeded, but no session was returned."
        );
        button.disabled = false;
        button.textContent = "Log in";
        return;
      }
      /*
        Supabase automatically persists this session
        in the browser.
        We do NOT store the password.
      */
      showMessage("Login successful!");
      window.setTimeout(() => {
        window.location.replace("game.html");
      }, 200);
    });
    checkLogin();
  </script>
</body>
</html>
